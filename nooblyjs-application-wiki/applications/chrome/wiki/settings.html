<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NooblyJS Wiki - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
      body { width: auto; min-height: auto; padding: 0; }
      .settings-shell { padding: 22px 24px; max-width: 560px; }
      .settings-shell h2 {
        font-family: 'Manrope', system-ui, sans-serif;
        font-size: 18px; font-weight: 800; letter-spacing: -.01em;
        color: var(--kr-ink-900); margin: 0 0 4px;
      }
      .settings-shell .lede {
        font-size: 10px; color: var(--kr-ink-500); margin: 0 0 18px;
      }
      .settings-shell .form-control {
        height: 36px;
        padding: 0 12px;
        border-radius: 9px;
        border: 1px solid var(--kr-border);
        background: var(--kr-surface-2);
        font-family: 'Manrope', system-ui, sans-serif;
        font-size: 10px;
        color: var(--kr-ink-900);
      }
      .settings-shell .form-control:focus {
        border-color: var(--kr-teal-500);
        background: #fff;
        box-shadow: 0 0 0 3px var(--kr-teal-50);
      }
      .settings-shell .form-label {
        font-size: 9px; font-weight: 700;
        color: var(--kr-ink-700); letter-spacing: .02em;
        margin-bottom: 6px;
      }
      .settings-shell .form-text {
        font-size: 8px; color: var(--kr-ink-400); margin-top: 6px;
      }
      .settings-shell .actions {
        display: flex; gap: 8px; margin-top: 18px;
      }
      .settings-shell .actions .btn { width: auto; }
      .settings-shell .actions .btn-outline-danger {
        background: #fdebec; color: var(--kr-danger);
        border: 1px solid #f5cfd1;
        height: 36px; padding: 0 16px;
        border-radius: 9px; font-weight: 600; font-size: 10px;
        font-family: 'Manrope', system-ui, sans-serif;
      }
      .settings-shell .actions .btn-outline-danger:hover {
        background: #f8dadc;
      }
      .settings-shell hr {
        border: 0; border-top: 1px solid var(--kr-border-2);
        margin: 22px 0;
      }
      .settings-shell h5 {
        font-family: 'Manrope', system-ui, sans-serif;
        font-size: 9px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .12em;
        color: var(--kr-ink-400); margin: 0 0 10px;
      }
      #current-storage {
        background: var(--kr-surface-2);
        border: 1px solid var(--kr-border);
        padding: 12px 14px;
        font-size: 8px;
        font-family: 'JetBrains Mono', monospace;
        color: var(--kr-ink-700);
        border-radius: var(--kr-radius);
        white-space: pre-wrap;
        max-height: 240px;
        overflow-y: auto;
      }
      #status .alert {
        padding: 10px 12px;
        border-radius: 9px;
        font-size: 10px;
        font-family: 'Manrope', system-ui, sans-serif;
        font-weight: 500;
        border: 1px solid transparent;
      }
      #status .alert-success {
        background: #e8f5ee; color: var(--kr-success); border-color: #c5e3d2;
      }
      #status .alert-warning {
        background: #fff5e6; color: var(--kr-warning); border-color: #ffe1b3;
      }
    </style>
</head>
<body>
    <div class="settings-shell">
        <h2>Extension Settings</h2>
        <p class="lede">Configure the NooblyJS Wiki server for this extension.</p>
        <form id="settings-form">
            <div class="mb-3">
                <label for="api-url" class="form-label">API Root URL</label>
                <input type="url" class="form-control" id="api-url" placeholder="https://localhost:9101" required>
                <div class="form-text">The root URL of your NooblyJS Wiki server.</div>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-secondary">Save</button>
                <button type="button" class="btn btn-outline-danger" id="clear-storage-btn">Clear Storage</button>
            </div>
        </form>
        <div id="status" class="mt-3"></div>
        <hr>
        <h5>Current Storage</h5>
        <pre id="current-storage"></pre>
    </div>
    <script src="js/settings.js"></script>
    <script>
      (async () => {
        const apiUrlInput = document.getElementById('api-url');
        const statusEl = document.getElementById('status');
        const storageEl = document.getElementById('current-storage');
        const form = document.getElementById('settings-form');
        const clearBtn = document.getElementById('clear-storage-btn');

        async function refreshStorageDisplay() {
          const all = await Settings.getAll();
          const safe = { ...all };
          if (safe.bearerToken) safe.bearerToken = safe.bearerToken.substring(0, 10) + '...';
          storageEl.textContent = JSON.stringify(safe, null, 2);
        }

        // Load current value
        const currentUrl = await Settings.getServerUrl();
        if (currentUrl) apiUrlInput.value = currentUrl;
        await refreshStorageDisplay();

        // Save handler
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          let url = apiUrlInput.value.trim().replace(/\/+$/, ''); // strip trailing slashes
          await Settings.setServerUrl(url);
          // Also clear any stale auth so next popup open re-authenticates against new server
          await chrome.storage.local.remove(['bearerToken', 'tokenUser', 'tokenExpiresAt', 'isAuthenticated']);
          statusEl.innerHTML = '<div class="alert alert-success">Saved! Re-open the extension popup to use the new URL.</div>';
          await refreshStorageDisplay();
        });

        // Clear storage handler
        clearBtn.addEventListener('click', async () => {
          if (confirm('Clear all extension storage? You will need to re-configure and re-authenticate.')) {
            await Settings.clear();
            apiUrlInput.value = '';
            statusEl.innerHTML = '<div class="alert alert-warning">Storage cleared.</div>';
            await refreshStorageDisplay();
          }
        });
      })();
    </script>
</body>
</html>
