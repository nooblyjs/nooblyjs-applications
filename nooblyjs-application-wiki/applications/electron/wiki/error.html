<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Error</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      opacity: 0.7;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1rem;
      color: #aaa;
    }
    code {
      background: #16213e;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      display: inline-block;
      font-size: 0.85rem;
      color: #4fc3f7;
      margin: 0.5rem 0;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.6rem 1.5rem;
      background: #4fc3f7;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #81d4fa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#128268;</div>
    <h1>Cannot Connect to Backend</h1>
    <p>The Knowledge Wiki backend server is not running or is unreachable.</p>
    <p>Start the backend server first:</p>
    <code>cd backend && npm run dev</code>
    <p style="margin-top: 1rem; font-size: 0.85rem;">
      The backend should be running on <strong>https://localhost:9101/</strong>
    </p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
